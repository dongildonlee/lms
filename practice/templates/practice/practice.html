{% extends "base.html" %}
{% block title %}Practice | Wrong-Answer Packets{% endblock %}

{% block content %}
<h1 class="text-3xl font-semibold mb-6 text-white drop-shadow">
  Practice <span id="subjectLabel" class="text-gray-300 text-lg"></span>
</h1>

<style>
  /* Make MathJax inline unless display */
  #qCard mjx-container { line-height: 1.6; }
  #qCard mjx-container[display="true"] { display:block !important; margin:.5rem 0 !important; }
  #qCard mjx-container:not([display="true"]) { display:inline !important; margin:0 !important; }
  #qCard mjx-container { vertical-align: baseline; }
  #qCard mjx-container svg { display: inline !important; }
  #qCard mjx-container[display="true"] svg { display: block !important; } /* keep display math block */
  #qCard .has-label { list-style: none; }
  #qCard .li-label { font-weight:600; margin-right:.4rem; }

  /* Dark text in the white card */
  #qCard, #qCard * { color:#0f172a; }

  /* Embedded PDFs compiled by the server */
  .latex-pdf { width:100%; height:240px; border:0; display:block; }
  .latex-pdf.choice { height:76px; } /* smaller for answers */

  /* Pretty choice buttons */
  .choice-btn{
    width:100%;
    text-align:left;
    padding:.75rem 1rem;
    border:1px solid #e5e7eb;             /* gray-200 */
    border-radius:.75rem;                  /* rounded-xl */
    background:rgba(255,255,255,.9);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .choice-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(2,6,23,.08);
    background:#fff;
  }
  .choice-key{ font-weight:600; margin-right:.5rem; }

  /* Shared passage frame */
  #shared-asset{
    border:1px solid #e5e7eb;
    border-radius: .75rem;
    background: #ffffff;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  #shared-asset .muted{
    color:#64748b; /* slate-500 */
    font-size:.95rem;
  }
</style>

<div id="qCard" class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 hidden">
  <!-- Shared article/passage stays mounted here (updates only when asset key changes) -->
  <div id="shared-asset"></div>

  <div id="stem" class="text-lg mb-4 whitespace-pre-wrap leading-7"></div>
  <div id="choices" class="space-y-2"></div>
  <div id="feedback" class="mt-4 font-semibold"></div>

  <div class="mt-6 flex items-center gap-3">
    <button id="nextBtn"
      class="inline-flex items-center justify-center px-4 py-2 rounded-xl
             border border-gray-200 bg-white/90 text-ink
             transition duration-200 ease-out transform
             hover:-translate-y-0.5 hover:shadow-md hover:bg-white
             focus:outline-none focus:ring-2 focus:ring-blue-500/30">
      Next ▶
    </button>

    <a href="/dashboard/"
       class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition">
      Back to Dashboard
    </a>
  </div>
</div>

<div id="status" class="mt-4 text-white/80"></div>
{% endblock %}

{% block scripts %}
<script>
  const $ = (sel) => document.querySelector(sel);
  let attemptId = null;
  let currentQ  = null;
  let qOffset   = 0;   // legacy offset; still used for non-bundle cases
  let qTotal    = 0;   // total questions for the current tag
  let renderToken = 0; // cancels stale async writes
  let currentAsset = null; // NEW: tracks shared passage/article key
  window._lastQid = null;  // last served question id, for bundle follow-up

  let viewTimer = { start: 0, acc: 0, running: false };
  let seenIds = new Set();   // track seen question IDs this session

  // ---------------- View-time logging ----------------
  function vtReset(){ viewTimer = { start: 0, acc: 0, running: false }; }
  function vtStart(){
    if (!viewTimer.running){
      viewTimer.start = performance.now();
      viewTimer.running = true;
    }
  }
  function vtPause(){
    if (viewTimer.running){
      viewTimer.acc += performance.now() - viewTimer.start;
      viewTimer.running = false;
    }
  }
  function vtMs(){
    return Math.round(viewTimer.acc + (viewTimer.running ? (performance.now() - viewTimer.start) : 0));
  }

  async function logViewIfAny(){
    try{
      vtPause();
      const ms = vtMs();
      if (!attemptId || !currentQ || ms <= 0) return;
      await api(`/api/attempts/${attemptId}/views/`, {
        method: 'POST',
        body: JSON.stringify({ question_id: currentQ.id, view_ms: ms })
      });
    }catch(e){ console.warn('view log failed', e); }
  }

  // pause/resume on visibility changes
  document.addEventListener('visibilitychange', () => (document.hidden ? vtPause() : vtStart()));
  window.addEventListener('blur', vtPause);
  window.addEventListener('focus', vtStart);

  // best-effort log on unload
  window.addEventListener('pagehide', () => {
    try{
      vtPause();
      const ms = vtMs();
      if (!attemptId || !currentQ || ms <= 0) return;
      const url = `/api/attempts/${attemptId}/views/`;
      const blob = new Blob([JSON.stringify({question_id: currentQ.id, view_ms: ms})], {type: 'application/json'});
      if (navigator.sendBeacon) navigator.sendBeacon(url, blob);
    }catch(_){}
  });

  // ---------------- CSRF ----------------
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
  const csrftoken = getCookie('csrftoken') || '';

  // ---------------- Helpers ----------------
  const HEAVY_ENV = '(tikzpicture|tabular|array|align\\*?|tcolorbox|axis)';
  const HEAVY_RE  = new RegExp('\\\\begin\\{'+HEAVY_ENV+'\\}[\\s\\S]*?\\\\end\\{\\1\\}');

  function extractFirstHeavyBlock(s){
    const m = s.match(HEAVY_RE);
    if(!m) return null;
    return { before: s.slice(0, m.index), block: m[0], after: s.slice(m.index + m[0].length) };
  }

  function stripDocBody(s){
    if(!s) return '';
    const m = s.match(/\\begin\{document\}([\s\S]*?)\\end\{document\}/);
    return m ? m[1] : s;
  }

  function cleanBefore(s){
    if(!s) return '';
    if (/\\documentclass|\\usepackage|\\geometry|\\begin\{document\}/.test(s)) return '';
    return s;
  }
  function cleanAfter(s){
    if(!s) return '';
    return s.replace(/\\end\{center\}/g,'')
            .replace(/\\bigskip/g,'')
            .replace(/%[=\-]{3,}.*/g,'');
  }

  function escapeHTML(x){ return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Make LaTeX lists render as HTML lists
  function maskLatexLists(s){
    if (!s) return s;
    s = s.replace(/\r\n?/g, '\n')
         .replace(/\\begin\{itemize\}/g,   '[[UL_OPEN]]')
         .replace(/\\end\{itemize\}/g,     '[[UL_CLOSE]]')
         .replace(/\\begin\{enumerate\}/g, '[[OL_OPEN]]')
         .replace(/\\end\{enumerate\}/g,   '[[OL_CLOSE]]');
    s = s.replace(/\\item(?:\s*\[([^\]]+)\])?\s*/g, (_m, label) =>
      label ? `[[LI:${label}]]` : '[[LI]]'
    );
    return s;
  }
  function unmaskLists(h){
    if (!h) return h;
    h = h.replace(/\[\[UL_OPEN\]\]/g, '<ul class="list-disc ml-6">')
         .replace(/\[\[OL_OPEN\]\]/g, '<ol class="list-decimal ml-6">')
         .replace(/\[\[UL_CLOSE\]\]/g, '[[/UL]]')
         .replace(/\[\[OL_CLOSE\]\]/g, '[[/OL]]')
         .replace(/\[\[LI:([^\]]+)\]\]/g, '</li><li class="has-label"><span class="li-label">$1</span> ')
         .replace(/\[\[LI\]\]/g, '</li><li>');
    h = h.replace(/<(ul|ol)([^>]*)>\s*<\/li><li>/g, '<$1$2><li>');
    h = h.replace(/\[\[\/UL\]\]/g, '</li></ul>')
         .replace(/\[\[\/OL\]\]/g, '</li></ol>');
    return h;
  }

  // Convert prose (with light TeX) to HTML
  function proseToHTML(s, opts = {}){
    const inline = !!opts.inline;
    if (s == null) return '';

    // keep author’s line breaks; treat TeX \\ as a newline
    s = s.replace(/\r\n?/g, '\n');
    s = s.replace(/\\\\\s*/g, '\n');

    // capture lists before HTML escaping
    s = maskLatexLists(s);

    let h = escapeHTML(s);

    // simple TeX text escapes/styles
    h = h.replace(/\\%/g, '%')
         .replace(/\\&/g, '&')
         .replace(/\\_/g, '_')
         .replace(/\\#/g, '#')
         .replace(/\\textbf\{([^}]*)\}/g, '<strong>$1</strong>')
         .replace(/\\emph\{([^}]*)\}/g,   '<em>$1</em>')
         .replace(/\\textit\{([^}]*)\}/g, '<em>$1</em>')
         .replace(/\\underline\{([^}]*)\}/g, '<u>$1</u>')
         .replace(/\\hfill/g, ''); // no-op on web

    if (inline){
      // inline mode for choices
      h = h.replace(/\n{2,}/g, '\n').replace(/\n/g, ' ');
      h = unmaskLists(h);
      return h.trim();
    }

    // block mode (stems)
    h = h.split(/\n{2,}/).map(block => {
      const trimmed = block.trim();
      if (!trimmed) return '';
      return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
    }).join('');

    h = unmaskLists(h)
         .replace(/<p>\s*(<(?:ul|ol)\b[^>]*>)/g, '$1')
         .replace(/(<\/(?:ul|ol)>)\s*<\/p>/g, '$1');

    return h.trim();
  }

  function normalizeTex(s){
    if(!s) return '';
    return s.replace(/\\\\\s*/g,' ')
            .replace(/\s*\n\s*/g,' ')
            .replace(/\s{2,}/g,' ')
            .trim();
  }

  // Wrap bare math for MathJax (don’t touch if already wrapped)
  function wrapInlineMathIfNeeded(s){
    if (!s) return s;
    const alreadyWrapped =
      /\$[^$]+\$/.test(s) || /\\\([^)]+\\\)/.test(s) || /\\begin\{(align|equation|gather)\}/.test(s);
    if (alreadyWrapped) return s;
    const looksMath = /\\[a-zA-Z]+|[_^]|\\sqrt|\\frac|\\cdot|\\times|\\sum|\\int/.test(s);
    if (!looksMath) return s;
    return `\\(${s.replace(/%/g, '\\%')}\\)`;
  }

  async function fetchPdfBlobUrl(tex){
    const res = await fetch('/practice/tex/pdf/', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'X-CSRFToken': csrftoken },
      body: JSON.stringify({ tex })
    });
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    if(!res.ok || !ct.includes('application/pdf')){
      const msg = await res.text();
      throw new Error(`TeX compile failed ${res.status}: ${msg}`);
    }
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  // MathJax manual typeset (deterministic)
  async function ensureMathJaxReady() {
    if (window.MathJax?.typesetPromise) return;
    await new Promise(resolve => {
      const deadline = Date.now() + 8000;
      (function poll(){
        if (window.MathJax?.typesetPromise || Date.now() > deadline) return resolve();
        setTimeout(poll, 25);
      })();
    });
  }
  async function typeset(target = document.querySelector('#qCard')){
    await ensureMathJaxReady();
    if (window.MathJax?.typesetPromise && target) {
      await MathJax.typesetPromise([target]);
    }
  }

  async function api(url, opts={}){
    const o = Object.assign({ headers:{} }, opts);
    if (!o.headers['Content-Type'] && o.body) o.headers['Content-Type']='application/json';
    if (opts.method === 'POST') o.headers['X-CSRFToken'] = csrftoken;
    const r = await fetch(url, o);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  // --------------- Shared passage helpers ---------------
  // If backend includes q.assets like ["passage-43-45"], use that; else parse from stem "\uses{passage-...}"
  function extractAssetKeyFromStem(stem) {
    const m = /\\uses\{([^}]+)\}/.exec(stem || "");
    return m ? m[1] : null;
  }

  async function renderSharedAsset(key) {
    // If you expose an endpoint like /api/assets/<key>?format=html, fetch it here:
    try {
      const res = await fetch(`/api/assets/${encodeURIComponent(key)}?format=html`, { headers: { 'Accept': 'text/html' }});
      if (res.ok) {
        return await res.text(); // trusted HTML from your server
      }
    } catch (_) {}
    // Fallback placeholder (keeps layout stable if endpoint not yet implemented)
    return `<div class="muted">Shared Passage: <code>${key}</code> (asset endpoint not configured)</div>`;
  }

  // --------------- Flow ---------------
  async function startPractice(){
    try{
      const data = await api('/api/attempts/', {
        method:'POST',
        body: JSON.stringify({ assignment_title:'Practice' })
      });
      attemptId = data.attempt_id;
      await loadQuestion();  // first question (no bundle follow-up)
    }catch(e){
      $('#status').textContent = `Failed to start: ${e.message}`;
    }
  }

  // Load a question; if bundleFollowupFor is provided, backend will return the next in the bundle
  async function loadQuestion(bundleFollowupFor = null){
    const token = ++renderToken;

    // clear previous UI
    $('#stem').innerHTML = '';
    $('#choices').innerHTML = '';
    $('#feedback').textContent = '';

    $('#qCard')?.classList.remove('hidden');
    $('#qCard').style.display='block';

    try{
      const tag = new URLSearchParams(location.search).get('tag') || '';
      const exclude = Array.from(seenIds);

      let url;
      if (bundleFollowupFor) {
        // Ask backend for the next item in the bundle sequence
        url = `/api/questions/?limit=1&bundle_followup_for=${encodeURIComponent(bundleFollowupFor)}&_t=${Date.now()}`;
      } else {
        // Normal selection (random with exclude)
        url = `/api/questions/?limit=1&offset=${qOffset}&ordering=-id&_t=${Date.now()}`
            + (tag ? `&tag=${encodeURIComponent(tag)}` : '')
            + (exclude.length ? `&exclude=${encodeURIComponent(exclude.join(','))}` : '');
      }

      const qRes = await api(url);
      if (token !== renderToken) return;

      if (!qRes.count || !qRes.questions?.length) {
        $('#stem').innerHTML = 'No unseen questions left for this filter.';
        $('#choices').innerHTML = '';
        $('#feedback').textContent = '';

        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = 'Restart session (allow repeats)';
        btn.onclick = () => { seenIds.clear(); qOffset = 0; loadQuestion(); };
        $('#choices').appendChild(btn);

        await typeset();
        return;
      }

      currentQ = qRes.questions[0];
      window._lastQid = currentQ.id;
      seenIds.add(currentQ.id);
      qTotal   = qRes.count || qTotal;
      qOffset  = (qOffset + 1) % Math.max(qTotal, 1);

      // ---------- Shared asset update (only when key changes) ----------
      const assetKey = (currentQ.assets && currentQ.assets.find(a => /^passage-/.test(a)))
                       || extractAssetKeyFromStem(currentQ.stem_md)
                       || null;

      if (assetKey !== currentAsset) {
        currentAsset = assetKey;
        if (currentAsset) {
          $('#shared-asset').innerHTML = '<div class="muted">Loading shared passage…</div>';
          try {
            const html = await renderSharedAsset(currentAsset);
            if (token !== renderToken) return;
            $('#shared-asset').innerHTML = html;
          } catch (e) {
            if (token !== renderToken) return;
            $('#shared-asset').innerHTML = `<div class="muted">Shared passage unavailable (${e.message})</div>`;
          }
        } else {
          $('#shared-asset').innerHTML = '';
        }
      }

      // ---------- STEM (heavy block → PDF) ----------
      const rawStem  = currentQ.stem_md || '';
      const body     = stripDocBody(rawStem);
      const parts    = extractFirstHeavyBlock(body);

      if(parts){
        const beforeHTML = proseToHTML(normalizeTex(cleanBefore(parts.before)));
        const afterHTML  = proseToHTML(normalizeTex(cleanAfter(parts.after)));
        const pdfUrl     = await fetchPdfBlobUrl(parts.block);
        if (token !== renderToken) return;
        $('#stem').innerHTML =
          `${beforeHTML}<object class="latex-pdf" data="${pdfUrl}" type="application/pdf"></object>${afterHTML}`;
      }else{
        if (token !== renderToken) return;
        $('#stem').innerHTML = proseToHTML(body);
      }

      // MathJax AFTER stem is in the DOM
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      if (window.MathJax?.typesetClear) MathJax.typesetClear();
      await typeset($('#stem'));
      if (token !== renderToken) return;

      // ---------- CHOICES (fixed A–E order) ----------
      const choicesDiv = $('#choices'); choicesDiv.innerHTML = '';
      const choices = currentQ.choices || {};
      const preferred = ['A','B','C','D','E'];
      let entries = preferred.filter(k => Object.prototype.hasOwnProperty.call(choices, k))
                             .map(k => [k, choices[k]]);
      if (entries.length === 0) {
        entries = Object.entries(choices).sort((a,b) => a[0].localeCompare(b[0]));
      }

      if (token !== renderToken) return;
      for (const [key,label] of entries){
        const cbody  = stripDocBody(label || '');
        const cparts = extractFirstHeavyBlock(cbody);

        const btn = document.createElement('button');
        btn.className = 'choice-btn';

        if(cparts){
          const before = proseToHTML(normalizeTex(cleanBefore(cparts.before)));
          const after  = proseToHTML(normalizeTex(cleanAfter(cparts.after)));
          const url    = await fetchPdfBlobUrl(cparts.block);
          if (token !== renderToken) return;
          btn.innerHTML =
            `<span class="choice-key">${key})</span>${before}` +
            `<object class="latex-pdf choice" data="${url}" type="application/pdf"></object>` +
            `${after}`;
        } else {
          const rawText   = normalizeTex(cbody);
          const maybeMath = wrapInlineMathIfNeeded(rawText);

          const keySpan  = document.createElement('span');
          keySpan.className = 'choice-key';
          keySpan.textContent = `${key}) `;

          const txtSpan  = document.createElement('span');
          txtSpan.className = 'choice-text';

          const isMath =
            /\$[^$]+\$/.test(rawText) ||
            /\\\([^)]+\\\)/.test(rawText) ||
            (maybeMath && maybeMath.startsWith('\\('));

          if (isMath) {
            txtSpan.textContent = maybeMath;      // raw TeX -> MathJax
          } else {
            txtSpan.innerHTML = proseToHTML(rawText, { inline: true });
          }

          btn.replaceChildren(keySpan, txtSpan);
        }

        btn.onclick = () => submitAnswer(key);
        choicesDiv.appendChild(btn);
      }

      if (token !== renderToken) return;
      await typeset(choicesDiv);

      // start a fresh view-session for this question
      vtReset();
      vtStart();

      $('#feedback').textContent = '';
      $('#status').textContent   = '';
    }catch(e){
      console.error(e);
      if (token !== renderToken) return;
      $('#status').textContent = `Failed to load question: ${e.message}`;
      $('#stem').innerHTML = '';
      $('#choices').innerHTML = '';
      $('#feedback').textContent = '';
    }
  }

  async function submitAnswer(choiceKey){
    if(!attemptId || !currentQ) return;
    try{
      const res = await api(`/api/attempts/${attemptId}/items/`, {
        method:'POST',
        body: JSON.stringify({ question_id: currentQ.id, answer:{ choice: choiceKey } })
      });
      const ok = !!res.is_correct;
      $('#feedback').textContent = ok ? '✅ Correct' : '❌ Incorrect';
      $('#feedback').className   = ok ? 'ok' : 'err';
    }catch(e){
      $('#feedback').textContent = `Submit failed: ${e.message}`;
      $('#feedback').className   = 'err';
    }
  }

  // Next button: send bundle_followup_for when we have a previous question id
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) {
    nextBtn.addEventListener('click', async () => {
      await logViewIfAny();   // record time spent on the current question
      vtReset();              // clear the timer
      const prev = window._lastQid || null;
      await loadQuestion(prev); // if prev is in a bundle, backend returns the next one
    });
  }

  document.addEventListener('DOMContentLoaded', startPractice);
</script>

<!-- MathJax (manual typeset via startup.typeset=false) -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$'], ['\\(','\\)']] },
    svg: { fontCache: 'global' },
    startup: { typeset: false }
  };
</script>
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
{% endblock %}
