<!doctype html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="utf-8" />
    <style>
      .actions { margin-top: 16px; display: flex; gap: 12px; }
      .actions button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <script>if (!localStorage.getItem("mockCurrentUser")) location.replace("/login");</script>

    <h1>Home</h1>
    <p>You are logged in (mock).</p>

    <div class="actions">
      <button type="button" id="btn-crypto">Crypto</button>
      <button type="button" id="btn-stocks">Stocks</button>
    </div>

    <p><button id="logout" type="button">Logout</button></p>

    <script>
      document.getElementById("btn-crypto").addEventListener("click", () => {
        // routes to your Investments page, which already links to the plotting endpoints
        location.href = "/investments";
      });
      document.getElementById("btn-stocks").addEventListener("click", () => {
        // placeholder for now — we can wire a /stocks page next step
        location.href = "/stocks";
      });
    </script>

    <script src="app.js"></script>
  </body>
</html>
