<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Create account</title>
        <link rel="stylesheet", href="styles.css">
    </head>
    <body>
        <h1>Create account</h1>
        <form id="signup-form" action="http://127.0.0.1:8000/api/signup/" method="post">
            <div>
                <label for="su-username">Username:</label>
                <input id="su-username" name="username" type="text" autocomplete="username" required>
            </div>
            <div>
                <label for="su-password">Password:</label>
                <input id="su-password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <div>
                <label for="su-password2">Confirm password:</label>
                <input id="su-password2" name="password2" type="password" autocomplete="new-password" required>
                <small id="pw-msg" style="margin-left:8px;"></small>
            </div>
            <button type="submit">Create account</button>
            </form>
            <p id="su-status"></p>
        <script src="app.js"></script>
    </body>
</html>
